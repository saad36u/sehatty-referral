    <!-- الاتصال بالباك-إند المحلي (محاكاة Kobo) — بدون أي اتصال بموقع خارجي -->
    <script>
        $('#citizenLoginForm').on('submit', function(e) {
            e.preventDefault();

            $.ajax({
                url: "/citizen/login",   // الباك-إند المحلي
                method: "POST",
                data: $(this).serialize(),
                success: function(res) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم تسجيل الدخول',
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = res.redirect;
                    });
                },
                error: function(xhr) {
                    var msg = (xhr.responseJSON && xhr.responseJSON.message)
                        ? xhr.responseJSON.message
                        : 'تعذّر تسجيل الدخول';
                    Swal.fire({ icon: 'error', title: 'خطأ', text: msg });
                }
            });
        });
    </script>
